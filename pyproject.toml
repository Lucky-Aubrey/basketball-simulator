[project]
name = "basketball-defense-simulator"
version = "0.1.0"
description = "Browser-based half-court play designer with a rule-based, tunable defense simulation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
